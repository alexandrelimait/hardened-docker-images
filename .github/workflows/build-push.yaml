      #       }') \
      #       ${{ env.REGISTRY }}/$IMAGE_NAME:$VERSION
      #     echo "Successfully created SLSA attestation"

      # - name: Push image
      #   if: ${{ !env.ACT && (github.event_name != 'workflow_dispatch' || inputs.push_image) }}
      #   run: |
      #     IMAGE_NAME="${{ steps.config.outputs.image_name }}"
      #     VERSION="${{ steps.config.outputs.version }}"
      #     echo "Pushing image: ${{ env.REGISTRY }}/$IMAGE_NAME:$VERSION"
      #     docker push ${{ env.REGISTRY }}/$IMAGE_NAME:$VERSION
      #     docker push ${{ env.REGISTRY }}/$IMAGE_NAME:latest
      #     echo "Successfully pushed: ${{ env.REGISTRY }}/$IMAGE_NAME:$VERSION"

  summary:
    needs: [prepare-matrix, build-images]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Create build summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Base Images**: ${{ inputs.base_images }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "**Commit SHA**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Registry**: ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Types**: Node.js and Python hardened base images" >> $GITHUB_STEP_SUMMARY
          echo "**Pushed**: ${{ inputs.push_image }}" >> $GITHUB_STEP_SUMMARY
          echo "**Signed**: Cosign signatures applied" >> $GITHUB_STEP_SUMMARY
          echo "**SLSA Attestation**: Supply chain metadata attached" >> $GITHUB_STEP_SUMMARY
          echo "**Build Status**: ${{ needs.build-images.result }}" >> $GITHUB_STEP_SUMMARY
