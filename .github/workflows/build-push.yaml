name: Build Hardened Base Image

on:
  # schedule:
  #   # Build nightly at 2 AM UTC
  #   - cron: '0 2 * * *'
  push:
    # branches: [ main ]
    paths:
      - '.github/.images/**'
  workflow_dispatch:
    inputs:
      base_images:
        description: 'Base images to build (one per line)'
        required: false
        default: |
          node:18-alpine
          node:20-alpine
          node:22-alpine
      push_image:
        description: 'Push image to registry'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nodejs-hardened-base

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set up build matrix
        id: set-matrix
        run: |
          BASE_IMAGES="${{ inputs.base_images }}"
          if [ -z "$BASE_IMAGES" ]; then
            BASE_IMAGES="node:18-alpine
          node:20-alpine
          node:22-alpine"
          fi
          echo "Input images: $BASE_IMAGES"
          # Convert newline-separated list to JSON array
          MATRIX_JSON=$(echo "$BASE_IMAGES" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Matrix JSON: $MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  build-images:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        base_image: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # - name: Login to Container registry
      #   if: ${{ !env.ACT }}
      #   run: |
      #     docker login -u ${{ secrets.REGISTRY_USERNAME }} -p ${{ secrets.REGISTRY_PASSWORD }} ${{ env.REGISTRY }}

      - name: Build image
        run: |
          BASE_IMAGE="${{ matrix.base_image }}"
          echo "Building image based on: $BASE_IMAGE"
          # Extract version for tagging
          NODE_VERSION=$(echo "$BASE_IMAGE" | sed 's/node://' | sed 's/:/-/g')
          # Build the image
          DOCKER_BUILDKIT=1 docker build \
            --cache-from=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$NODE_VERSION \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg COMMIT_HASH=$GITHUB_SHA \
            --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$NODE_VERSION \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -f .github/.images/Dockerfile .github/.images
          echo "Successfully built: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$NODE_VERSION"

