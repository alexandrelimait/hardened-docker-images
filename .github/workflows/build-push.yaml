name: Build Hardened Base Images

on:
  schedule:
    # Build nightly at 2 AM UTC
    - cron: '0 2 * * *'
  push:
    branches: [ change-dockerfile ]
    # paths:
    #   - '.github/images/**'
  workflow_dispatch:
    inputs:
      base_images:
        description: 'Base images to build (one per line)'
        required: true
        default: |
          node:18-alpine
          node:20-alpine
          python:3.11-alpine
          python:3.12-alpine
          python:3.13-alpine
      push_image:
        description: 'Push image to registry'
        required: true
        default: true
        type: boolean

env:
  DEFAULT_BASE_IMAGES: |
    node:18-alpine
    node:20-alpine
    python:3.11-alpine
    python:3.12-alpine
    python:3.13-alpine

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set up build matrix
        id: set-matrix
        run: |
          BASE_IMAGES="${{ inputs.base_images }}"
          # Use default base images if no input provided (e.g., on push/schedule triggers)
          if [ -z "$BASE_IMAGES" ]; then
            BASE_IMAGES="${{ env.DEFAULT_BASE_IMAGES }}"
            echo "Using default base images for ${{ github.event_name }} trigger"
            echo "Branch: ${{ github.ref_name }}"
          fi
          echo "Input images: $BASE_IMAGES"
          # Convert newline-separated list to JSON array
          MATRIX_JSON=$(echo "$BASE_IMAGES" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Matrix JSON: $MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  build-images:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        base_image: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Determine image type and configuration
        id: config
        run: |
          BASE_IMAGE="${{ matrix.base_image }}"
          echo "Processing base image: $BASE_IMAGE"
          
          # Determine if it's a Node.js or Python image
          if [[ "$BASE_IMAGE" == node:* ]]; then
            IMAGE_TYPE="node"
            IMAGE_NAME="nodejs-hardened-base"
            DOCKERFILE="Dockerfile.node"
          elif [[ "$BASE_IMAGE" == python:* ]]; then
            IMAGE_TYPE="python"
            IMAGE_NAME="python-hardened-base"
            DOCKERFILE="Dockerfile.python"
          else
            echo "Error: Unknown image type for $BASE_IMAGE"
            exit 1
          fi
          
          # Extract version for tagging
          if [[ "$IMAGE_TYPE" == "node" ]]; then
            VERSION=$(echo "$BASE_IMAGE" | sed 's/node://' | sed 's/:/-/g')
          else
            VERSION=$(echo "$BASE_IMAGE" | sed 's/python://' | sed 's/:/-/g')
          fi
          
          echo "Image type: $IMAGE_TYPE"
          echo "Image name: $IMAGE_NAME"
          echo "Dockerfile: $DOCKERFILE"
          echo "Version: $VERSION"
          
          echo "image_type=$IMAGE_TYPE" >> $GITHUB_OUTPUT
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "dockerfile=$DOCKERFILE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .github/images
          file: .github/images/${{ steps.config.outputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}
          tags: ${{ secrets.REGISTRY }}/${{ steps.config.outputs.image_name }}:${{ steps.config.outputs.version }}
          cache-from: type=registry,ref=${{ secrets.REGISTRY }}/${{ steps.config.outputs.image_name }}:cache
          cache-to: type=registry,ref=${{ secrets.REGISTRY }}/${{ steps.config.outputs.image_name }}:cache,mode=max
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            COMMIT_HASH=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          provenance: false

  summary:
    needs: [prepare-matrix, build-images]
    runs-on: ubuntu-latest
    if: needs.build-images.result == 'success'
    steps:
      - name: Get matrix information
        id: matrix-info
        run: |
          # Get the matrix from the prepare-matrix job
          MATRIX_JSON='${{ needs.prepare-matrix.outputs.matrix }}'
          echo "matrix_json=$MATRIX_JSON" >> $GITHUB_OUTPUT
          
          # Parse the matrix to get actual base images
          BASE_IMAGES=$(echo "$MATRIX_JSON" | jq -r '.[]')
          echo "base_images<<EOF" >> $GITHUB_OUTPUT
          echo "$BASE_IMAGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create build summary
        run: |
          echo "## 🐳 Hardened Docker Images Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Build Information" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Date** | $(date -u +"%Y-%m-%d %H:%M:%S UTC") |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Registry** | \`${{ secrets.REGISTRY }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | \`linux/amd64\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Push Status** | ${{ inputs.push_image }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Status** | ✅ **${{ needs.build-images.result }}** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🏗️ Built Images" >> $GITHUB_STEP_SUMMARY
          echo "| Base Image | Hardened Image | Tag | Type |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|----------------|-----|------|" >> $GITHUB_STEP_SUMMARY
          
          # Generate table rows dynamically from the matrix
          while IFS= read -r base_image; do
            if [[ -n "$base_image" ]]; then
              # Determine image type and name
              if [[ "$base_image" == node:* ]]; then
                hardened_image="nodejs-hardened-base"
                type="Node.js"
              elif [[ "$base_image" == python:* ]]; then
                hardened_image="python-hardened-base"
                type="Python"
              else
                hardened_image="unknown-hardened-base"
                type="Unknown"
              fi
              
              # Extract version for tag
              if [[ "$type" == "Node.js" ]]; then
                tag=$(echo "$base_image" | sed 's/node://' | sed 's/:/-/g')
              elif [[ "$type" == "Python" ]]; then
                tag=$(echo "$base_image" | sed 's/python://' | sed 's/:/-/g')
              else
                tag="unknown"
              fi
              
              echo "| \`$base_image\` | \`$hardened_image\` | \`$tag\` | $type |" >> $GITHUB_STEP_SUMMARY
            fi
          done <<< "${{ steps.matrix-info.outputs.base_images }}"
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Image URLs" >> $GITHUB_STEP_SUMMARY
          echo "All images are available at: \`${{ secrets.REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Example pull commands:**" >> $GITHUB_STEP_SUMMARY
          echo "```bash" >> $GITHUB_STEP_SUMMARY
          
          # Generate pull commands dynamically
          while IFS= read -r base_image; do
            if [[ -n "$base_image" ]]; then
              if [[ "$base_image" == node:* ]]; then
                hardened_image="nodejs-hardened-base"
              elif [[ "$base_image" == python:* ]]; then
                hardened_image="python-hardened-base"
              else
                hardened_image="unknown-hardened-base"
              fi
              
              if [[ "$type" == "Node.js" ]]; then
                tag=$(echo "$base_image" | sed 's/node://' | sed 's/:/-/g')
              elif [[ "$type" == "Python" ]]; then
                tag=$(echo "$base_image" | sed 's/python://' | sed 's/:/-/g')
              else
                tag="unknown"
              fi
              
              echo "docker pull ${{ secrets.REGISTRY }}/$hardened_image:$tag" >> $GITHUB_STEP_SUMMARY
            fi
          done <<< "${{ steps.matrix-info.outputs.base_images }}"
          
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🛡️ Security Features" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Non-root user** - All images run as non-root" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Minimal attack surface** - Removed unnecessary tools" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Secure permissions** - Proper file permissions" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Alpine-based** - Lightweight and secure base" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY